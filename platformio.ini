; GGG (General Gadget Generator) PlatformIO Configuration
; Universal modular event-driven framework for microcontroller platforms

[platformio]
default_envs = native

[env]
build_flags = 
    -I include
    -std=c++14
    -Wall
    -Wextra
lib_ldf_mode = deep+
lib_extra_dirs = 
    plugins
extra_scripts = 
    pre:scripts/apply_kconfig.py
    post:scripts/custom_targets.py

[env:native]
platform = native
test_framework = unity
build_flags = 
    ${env.build_flags}
    -D GGG_TARGET_NATIVE
    -D RUN_NATIVE_TESTS

[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
lib_deps = 
    briscoetech/FreeRTOS_SAMD21 @ ^2.3.0
build_flags = 
    ${env.build_flags}
    -D GGG_TARGET_SAMD21
    -D GGG_BUILD_STANDALONE
